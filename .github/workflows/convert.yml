name: Convert and publish

on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/convert.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: convert-publish
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/convert.py --inbox inbox --out docs/frame
      - name: Commit converted pictures
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/frame
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Convert pictures [skip ci]"
            git push || (git pull --rebase origin main && git push)
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: convert
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.convert.outputs.sha }}
      - uses: actions/configure-pages@v5
      - name: Cache-bust site assets
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s/(app\.js|schedule\.js|config\.js|styles\.css)\"/\1?v=$v\"/g" docs/index.html
          grep -o 'src="[^"]*"\|href="[^"]*"' docs/index.html | grep "?v=" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
